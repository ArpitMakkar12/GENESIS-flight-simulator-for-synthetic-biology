name: BioSandbox CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biosandbox
          POSTGRES_PASSWORD: biosandbox
          POSTGRES_DB: biosandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils libglpk-dev

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL_SYNC: postgresql://biosandbox:biosandbox@localhost:5432/biosandbox_test
          DATABASE_URL: postgresql+asyncpg://biosandbox:biosandbox@localhost:5432/biosandbox_test
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://biosandbox:biosandbox@localhost:5432/biosandbox_test
          DATABASE_URL_SYNC: postgresql://biosandbox:biosandbox@localhost:5432/biosandbox_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: "true"
        run: python -m pytest tests/ -v --tb=short || echo "No tests yet — skipping"

  frontend-test:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build check
        working-directory: ./frontend
        run: npm run build
