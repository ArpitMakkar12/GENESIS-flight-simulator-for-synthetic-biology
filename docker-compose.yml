version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: biosandbox
      POSTGRES_PASSWORD: biosandbox
      POSTGRES_DB: biosandbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biosandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://biosandbox:biosandbox@db:5432/biosandbox
      DATABASE_URL_SYNC: postgresql://biosandbox:biosandbox@db:5432/biosandbox
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      ALLOWED_ORIGINS: http://localhost:3000
      MODEL_DIR: /app/data/models
    volumes:
      - ./backend:/app
      - ./ai:/app/ai_module
      - ./contracts:/app/contracts
      - model_data:/app/data/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
  model_data:
